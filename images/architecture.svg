<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">PeaSyo v2 Rust Architecture</title>
  <desc id="desc">Layered architecture diagram for PeaSyo v2, covering React Native UI, PeaSyo Rust Core, Android platform integration, and PlayStation/PSN endpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>

  <text x="600" y="52" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">
    PeaSyo v2 Rust Architecture
  </text>
  <text x="600" y="82" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">
    High-performance native streaming core with thin Android platform integration
  </text>

  <!-- Layer 1 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="120" width="1040" height="112" rx="18" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  </g>
  <text x="110" y="155" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#1d4ed8">React Native UI Layer</text>
  <text x="110" y="188" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">Home, streaming overlays, settings, controller test, performance panel</text>
  <text x="110" y="212" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">Fast iteration for phones, tablets, TV devices, and handheld consoles</text>

  <!-- Layer 2 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="284" width="1040" height="220" rx="22" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
    <rect x="80" y="284" width="1040" height="56" rx="22" fill="url(#rust)"/>
    <path d="M80 318 H1120 V340 H80 Z" fill="url(#rust)"/>
  </g>
  <text x="110" y="321" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#ffffff">PeaSyo Rust Core</text>
  <text x="890" y="321" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="14" fill="#dffcff">low latency, high throughput, memory-safe runtime</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="110" y="366" width="230" height="104" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="130" y="394" font-size="16" font-weight="800" fill="#155e75">Connection Owner</text>
    <text x="130" y="420" font-size="13" fill="#334155">PSN HTTP / Push WebSocket</text>
    <text x="130" y="442" font-size="13" fill="#334155">NAT probe, holepunch, RUDP</text>
    <text x="130" y="462" font-size="12" fill="#64748b">Remote connection and registration</text>

    <rect x="365" y="366" width="230" height="104" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="385" y="394" font-size="16" font-weight="800" fill="#1d4ed8">Session Runtime</text>
    <text x="385" y="420" font-size="13" fill="#334155">Lifecycle, shutdown, state flow</text>
    <text x="385" y="442" font-size="13" fill="#334155">Takion control/data transport</text>
    <text x="385" y="462" font-size="12" fill="#64748b">Runtime state and packet scheduling</text>

    <rect x="620" y="366" width="230" height="104" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="640" y="394" font-size="16" font-weight="800" fill="#166534">Media Pipeline</text>
    <text x="640" y="420" font-size="13" fill="#334155">Reorder, FEC, frame assembly</text>
    <text x="640" y="442" font-size="13" fill="#334155">Audio decode, FPS, jitter, loss</text>
    <text x="640" y="462" font-size="12" fill="#64748b">Video, audio, and telemetry pipeline</text>

    <rect x="875" y="366" width="215" height="104" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="895" y="394" font-size="16" font-weight="800" fill="#9a3412">Input + Feedback</text>
    <text x="895" y="420" font-size="13" fill="#334155">Gamepad, touchpad, keyboard</text>
    <text x="895" y="442" font-size="13" fill="#334155">Rumble, haptics, triggers</text>
    <text x="895" y="462" font-size="12" fill="#64748b">Input routing and force feedback</text>
  </g>

  <!-- Layer 3 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="556" width="1040" height="96" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <text x="110" y="586" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#334155">Android Platform Layer</text>
  <text x="110" y="616" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">MediaCodec Surface/TextureView, Rust Oboe audio, USB permissions</text>
  <text x="110" y="638" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">SDL gamepad bridge, native haptics, adaptive trigger bridge</text>

  <!-- Layer 4 -->
  <g filter="url(#softShadow)">
    <rect x="80" y="690" width="500" height="48" rx="16" fill="#0f172a"/>
    <rect x="620" y="690" width="500" height="48" rx="16" fill="#0f172a"/>
  </g>
  <text x="330" y="721" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">PSN Services</text>
  <text x="870" y="721" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">PS4 / PS5 Remote Play Endpoint</text>

  <!-- Simplified flows -->
  <line x1="600" y1="232" x2="600" y2="284" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="263" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">commands + runtime events</text>

  <line x1="600" y1="504" x2="600" y2="556" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="535" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">decoded media + device I/O</text>

  <line x1="330" y1="504" x2="330" y2="556" stroke="#475569" stroke-width="3"/>
  <line x1="330" y1="652" x2="330" y2="690" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="674" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">PSN auth / push</text>

  <line x1="870" y1="504" x2="870" y2="556" stroke="#475569" stroke-width="3"/>
  <line x1="870" y1="652" x2="870" y2="690" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="892" y="626" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">stream + control packets</text>
</svg>
